<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MyGym Status</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0D061A;
      --card-bg: #170C2E;
      --card-border: rgba(34, 197, 94, 0.2);
      --accent: #22C55E;
      --accent-gradient: linear-gradient(135deg, #22C55E, #10B981);
      --ring-outer: #22C55E;
      --ring-inner: #00F0FF;
      --green: #22C55E;
      --red: #F43F5E;
      --text-main: #F8FAFC;
      --text-sub: #A78BFA;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Zen Kaku Gothic New', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(34, 197, 94, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 197, 94, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text-main);
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px calc(90px + env(safe-area-inset-bottom));
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, .time-main, .btn-primary, .timer-action-btn, .stat-num {
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.03em;
    }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    
    .brand-logo-svg { width: 38px; height: 38px; filter: drop-shadow(0 0 8px rgba(34,197,94,0.5)); }
    .brand-title h1 { font-size: 1.3rem; font-weight: 800; color: #FFF; text-shadow: 0 0 10px rgba(34,197,94,0.5); }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    .notif-bell-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 50%; width: 38px; height: 38px; align-items: center; justify-content: center; color: var(--text-sub); cursor: pointer; position: relative; transition: 0.2s; }
    .notif-bell-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .notif-badge { position: absolute; top: -2px; right: -2px; background: var(--red); color: white; font-size: 0.6rem; font-weight: 800; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 6px var(--red); }
    
    .lang-switcher { display: flex; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 3px; gap: 2px; }
    .lang-btn { background: none; border: none; color: var(--text-sub); padding: 6px 12px; font-size: 0.75rem; font-weight: 700; border-radius: 16px; cursor: pointer; transition: 0.2s; }
    .lang-btn.active { background: var(--accent); color: #0D061A; box-shadow: 0 0 10px var(--accent); }

    .view { display: none; flex-direction: column; gap: 16px; animation: fadeIn 0.3s ease-out; }
    .view.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); position: relative; overflow: hidden; width: 100%; }
    .card::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(13, 6, 26, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
    .modal-content { width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto; background: #130a24; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); position: relative; }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; width: 100%; }
    label { font-size: 0.8rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
    input, textarea { width: 100%; max-width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; color: white; outline: none; font-size: 0.95rem; text-align: center; box-sizing: border-box; }
    input[type="date"], input[type="time"] { appearance: none; -webkit-appearance: none; }
    
    .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 150px; overflow-y: auto; padding-right: 4px; }
    .avatar-option { font-size: 1.4rem; text-align: center; padding: 6px; background: rgba(0,0,0,0.3); border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .avatar-option.selected { border-color: var(--accent); background: rgba(34,197,94,0.2); transform: scale(1.05); }
    
    .btn-primary { width: 100%; background: var(--accent-gradient); color: #0D061A; border: none; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 1rem; cursor: pointer; box-shadow: 0 0 15px rgba(34,197,94,0.3); }
    .btn-secondary { width: 100%; background: rgba(34,197,94,0.1); color: var(--accent); border: 1px solid var(--card-border); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    
    .home-status-box { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 14px; text-align: center; margin-bottom: 10px; border: 1px solid var(--card-border); }
    .home-status-title { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .home-status-text { font-size: 1rem; font-weight: 700; color: white; }
    .status-free { color: var(--green); text-shadow: 0 0 8px rgba(34,197,94,0.4); }
    
    .timer-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0 20px; position: relative; }
    .progress-ring { transform: rotate(-90deg); filter: drop-shadow(0 0 10px rgba(34,197,94,0.2)); }
    .ring-track { fill: none; stroke: rgba(255,255,255,0.03); stroke-width: 14; }
    .ring-progress-outer { fill: none; stroke: var(--ring-outer); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
    .ring-progress-inner { fill: none; stroke: var(--ring-inner); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
    
    .timer-display { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; }
    .time-main { font-size: 2.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; line-height: 1; color: #FFF; text-shadow: 0 0 15px rgba(255,255,255,0.4); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    .time-sub { font-size: 0.8rem; color: var(--text-sub); font-weight: 700; letter-spacing: 1px; }

    .timer-action-btn { background: rgba(34, 197, 94, 0.1); color: var(--green); border: 1px solid var(--card-border); padding: 14px 40px; border-radius: 16px; font-weight: 800; font-size: 1rem; cursor: pointer; box-shadow: 0 0 15px rgba(34,197,94,0.2); margin-top: 10px; transition: 0.2s; }
    .timer-action-btn.start { background: rgba(34, 197, 94, 0.15); color: var(--green); border-color: rgba(34, 197, 94, 0.4); }
    .timer-action-btn.stop { background: rgba(244, 63, 94, 0.15); color: var(--red); border-color: rgba(244, 63, 94, 0.4); box-shadow: 0 0 15px rgba(244,63,94,0.2); }

    .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .cal-title-month { font-size: 1.3rem; font-weight: 800; color: #FFF; font-family: 'Syne', sans-serif; text-transform: capitalize; }
    .cal-nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: white; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .cal-nav-btn:hover { background: rgba(34,197,94,0.2); border-color: var(--accent); }
    .cal-nav-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-box { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 8px; text-align: center; }
    .stat-num { font-size: 1.2rem; font-weight: 800; color: var(--ring-inner); text-shadow: 0 0 8px rgba(0,240,255,0.3); margin-top: 4px; }
    .stat-label { font-size: 0.65rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
    .cal-weekday { text-align: center; font-size: 0.75rem; color: var(--text-sub); font-weight: 700; padding-bottom: 4px; }
    .cal-day { aspect-ratio: 1; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.04); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; position: relative; }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-day.has-activity { background: linear-gradient(135deg, rgba(34,197,94,0.25), rgba(0,240,255,0.25)); border-color: var(--accent); color: #FFF; box-shadow: 0 0 8px rgba(34,197,94,0.3); }
    .cal-day.selected { border: 2px solid #FFF; transform: scale(1.05); }

    .cal-detail-card { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .cal-detail-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 8px; }
    .cal-detail-date { font-size: 0.85rem; color: var(--text-sub); font-weight: 700; }
    
    .cal-user-log-item { background: rgba(0,0,0,0.25); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: 0.2s; }
    .cal-user-log-item:hover { border-color: var(--accent); background: rgba(34,197,94,0.05); }

    .timeline-card-item { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; transition: 0.3s; }
    .timeline-header { display: flex; justify-content: space-between; align-items: center; }
    .timeline-user-box { display: flex; align-items: center; gap: 8px; }
    .timeline-avatar { font-size: 1.3rem; width: 36px; height: 36px; background: rgba(255,255,255,0.05); border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--card-border); }
    .timeline-name { color: #FFF; font-weight: 800; font-size: 0.95rem; }
    .timeline-time { color: var(--text-sub); font-size: 0.7rem; }
    .timeline-duration { color: var(--ring-inner); font-weight: 800; font-size: 1.1rem; font-family: 'Syne'; }
    .timeline-memo { font-size: 0.85rem; color: var(--text-sub); background: rgba(0,0,0,0.25); padding: 8px 10px; border-radius: 10px; word-break: break-all; }
    
    .timeline-actions { display: flex; gap: 8px; margin-top: 4px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); }
    .action-icon-btn { background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); border-radius: 12px; width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: var(--text-sub); }
    .action-icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: 0.2s; }
    .action-icon-btn.liked { background: rgba(244,63,94,0.15); border-color: rgba(244,63,94,0.4); color: var(--red); }
    .action-icon-btn.liked svg { fill: var(--red); stroke: var(--red); filter: drop-shadow(0 0 6px rgba(244,63,94,0.5)); transform: scale(1.08); }
    .action-icon-btn:hover { border-color: var(--accent); color: var(--accent); }

    @keyframes highlightFlash { 0% { background: rgba(34, 197, 94, 0.3); border-color: var(--accent); transform: scale(1.02); } 100% { background: rgba(0,0,0,0.3); border-color: var(--card-border); transform: scale(1); } }
    .highlight-log { animation: highlightFlash 1.5s ease-out; }

    .comment-list-box { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; margin-bottom: 12px; }
    .comment-row { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 10px; padding: 8px 10px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }

    .notif-item { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; transition: 0.2s; }

    .race-card-item { background: rgba(0,0,0,0.35); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; position: relative; overflow: hidden; transition: 0.2s; }
    .race-card-item.is-top1 { border-color: #FFD700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); background: linear-gradient(135deg, rgba(23,12,46,0.9), rgba(255,215,0,0.08)); }
    .race-card-item.is-me { border-color: var(--ring-inner); box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); }
    .race-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; position: relative; z-index: 2; }
    .race-user-info { display: flex; align-items: center; gap: 10px; }
    .race-avatar-box { font-size: 1.5rem; width: 40px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--card-border); }
    .race-name { font-weight: 800; font-size: 1.05rem; color: #FFF; display: flex; align-items: center; gap: 6px; }
    .race-score-wrap { text-align: right; }
    .race-score-main { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; color: var(--ring-inner); text-shadow: 0 0 8px rgba(0,240,255,0.4); }
    .race-score-sub { font-size: 0.7rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }
    .race-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; position: relative; z-index: 2; }
    .race-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--ring-inner)); border-radius: 4px; transition: width 0.6s cubic-bezier(0.1, 1, 0.1, 1); box-shadow: 0 0 10px rgba(34,197,94,0.5); }
    
    .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 16px; letter-spacing: 0.05em; color: #FFF; }
    .profile-header { display: flex; align-items: center; gap: 16px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--card-border); }
    .profile-avatar { font-size: 2.5rem; background: rgba(255,255,255,0.05); width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 16px; border: 1px solid var(--card-border); }
    .profile-name { font-size: 1.4rem; font-weight: 800; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .list-item:last-child { border-bottom: none; }
    .list-date { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
    .list-title { font-weight: 700; color: #FFF; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
    .btn-action-svg { background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); color: var(--text-sub); width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; margin-left: 6px; }
    .btn-action-svg:hover { background: rgba(34,197,94,0.2); border-color: var(--accent); color: var(--accent); }
    .btn-action-svg.delete:hover { background: rgba(244,63,94,0.2); border-color: var(--red); color: var(--red); }
    .btn-action-svg svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .manual-log-box { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--card-border); width: 100%; box-sizing: border-box; }
    .time-inputs-row { display: flex; gap: 10px; align-items: center; width: 100%; }
    .time-input-col { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .empty-msg { text-align: center; color: var(--text-sub); padding: 20px; font-size: 0.9rem; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13, 6, 26, 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; padding: 16px 0 calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--card-border); z-index: 1000; }
    .nav-btn { background: transparent; border: none; color: var(--text-sub); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; padding: 4px 15px; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: 0.2s; }
    .nav-btn.active svg { transform: translateY(-3px); filter: drop-shadow(0 0 8px var(--accent)); }
  </style>
</head>
<body>

  <!-- (モーダル系は省略...機能はすべて維持しています) -->
  <div id="auth-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 style="text-align:center; margin-bottom: 16px; font-size: 1.3rem;" id="t-modal-title">Bienvenido</h2>
      <div class="form-group"><label id="t-modal-name">Tu nombre</label><input type="text" id="regNameInput" placeholder="Name" /></div>
      <div class="form-group"><label id="t-modal-avatar">Avatar</label><div class="avatar-grid" id="modal-avatar-grid"></div></div>
      <button class="btn-primary" onclick="registerUser()" id="t-btn-register">Comenzar 🚀</button>
    </div>
  </div>

  <div id="memo-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 style="text-align:center; margin-bottom: 6px; font-size: 1.2rem;" id="t-memo-title">¡Buen trabajo! 💪</h2>
      <div class="form-group"><textarea id="trainingMemoInput" rows="3"></textarea></div>
      <button class="btn-primary" onclick="submitTrainingLog(false)" id="t-btn-save-log">Guardar Registro ✨</button>
      <button class="btn-secondary" onclick="submitTrainingLog(true)" id="t-btn-skip-memo">Terminar sin nota</button>
    </div>
  </div>

  <div id="comment-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
        <h2 style="font-size: 1.1rem;" id="t-comment-title">💬 コメント</h2>
        <button onclick="closeCommentModal()" style="background:none; border:none; color:var(--text-sub); cursor:pointer;">✕</button>
      </div>
      <div class="comment-list-box" id="modal-comment-list"></div>
      <div class="form-group" style="margin-bottom:0;"><input type="text" id="modal-comment-input" maxlength="50"/><button class="btn-primary" onclick="submitModalComment()" style="padding:10px; margin-top:6px;" id="t-comment-send">送信する</button></div>
    </div>
  </div>

  <div id="edit-log-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 style="text-align:center; margin-bottom: 14px; font-size: 1.2rem;" id="t-edit-log-title">Editar Registro</h2>
      <div class="form-group"><input type="date" id="editLogDate" /></div>
      <div class="form-group time-inputs-row">
        <div class="time-input-col"><label id="t-edit-label-from">Desde</label><input type="time" id="editLogTimeFrom" /></div>
        <div class="time-input-col"><label id="t-edit-label-to">Hasta</label><input type="time" id="editLogTimeTo" /></div>
      </div>
      <div class="form-group"><input type="text" id="editLogMemo" /></div>
      <button class="btn-primary" onclick="saveEditedLog()" id="t-btn-save-edit-log">Guardar Cambios</button>
      <button class="btn-secondary" onclick="closeEditLogModal()" id="t-btn-cancel-edit-log">Cancelar</button>
    </div>
  </div>

  <div id="notification-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <h2 style="font-size: 1.1rem;" id="t-notif-title">🔔 通知</h2>
        <button onclick="closeNotificationModal()" style="background:none; border:none; color:var(--text-sub); cursor:pointer;">✕</button>
      </div>
      <div id="notification-list-container" style="display:flex; flex-direction:column; max-height: 350px; overflow-y:auto;">
        <div class="empty-msg">Sin notificaciones</div>
      </div>
    </div>
  </div>

  <!-- 本文 -->
  <header>
    <div class="brand">
      <svg class="brand-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

    const db = getDatabase(initializeApp(firebaseConfig));

    // ... (関数ロジックは前回同様)
    // 修正箇所：selectCalendarDay内で空の場合はinnerHTMLをクリアするように変更
    window.selectCalendarDay = (dateKey, clickedEl, updateSelectionState = true) => {
      if (updateSelectionState) {
        selectedDateStr = dateKey;
        document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
        if (clickedEl) clickedEl.classList.add('selected');
      }
      const t = i18n[currentLang];
      document.getElementById("selected-date-text").innerText = dateKey.split('-').reverse().join('/');
      const usersListEl = document.getElementById("selected-date-users-list");
      const totalBadgeEl = document.getElementById("selected-date-total-badge");

      const logsForDay = Object.entries(allLogsData).filter(([k, l]) => l.date && l.date.startsWith(dateKey));
      if (logsForDay.length === 0) {
        usersListEl.innerHTML = ""; // 空にする
        totalBadgeEl.innerText = "";
      } else {
        let targetTotal = 0;
        logsForDay.forEach(l => { if(l[1].user === calendarTargetUser) targetTotal += l[1].duration; });
        totalBadgeEl.innerText = `${targetTotal} ${t.unitMin}`;
        usersListEl.innerHTML = logsForDay.map(([k, l]) => `
          <div class="cal-user-log-item" onclick="switchCalendarUser('${l.user}')">
            <div style="display:flex; justify-content:space-between;">
              <span>${l.avatar} ${l.user}</span><span>${l.duration}分</span>
            </div>
          </div>
        `).join("");
      }
    };

    // (以下、初期化処理などはそのまま)
    document.addEventListener("DOMContentLoaded", () => {

        switchLang(currentLang);

        switchTab('home');
    });
