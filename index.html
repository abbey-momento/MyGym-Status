<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MyGym Status</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spinnaker&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b1120; --card-bg: #151f32; --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1; --accent-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
      --green: #10b981; --red: #f43f5e; --amber: #f59e0b;
      --text-main: #f8fafc; --text-sub: #94a3b8;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Spinnaker', 'Zen Kaku Gothic New', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: var(--bg); color: var(--text-main); max-width: 480px; margin: 0 auto; padding: 20px 16px calc(90px + env(safe-area-inset-bottom)); min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { background: var(--accent-gradient); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 1.2rem; }
    .brand-title h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.02em; }
    
    .lang-switcher { display: flex; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 3px; gap: 2px; }
    .lang-btn { background: none; border: none; color: var(--text-sub); padding: 6px 12px; font-size: 0.75rem; font-weight: 700; border-radius: 16px; cursor: pointer; transition: 0.2s; }
    .lang-btn.active { background: var(--accent); color: white; box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4); }

    .view { display: none; flex-direction: column; gap: 16px; animation: fadeIn 0.3s; }
    .view.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
    
    .active-users { display: flex; flex-direction: column; gap: 10px; }
    .active-user-row { display: flex; justify-content: space-between; align-items: center; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); padding: 12px; border-radius: 16px; }
    .active-user-info { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .avatar-icon { font-size: 1.5rem; }
    .btn-stop-sm { background: rgba(244, 63, 94, 0.15); color: var(--red); border: none; padding: 8px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .no-users { text-align: center; color: var(--green); font-weight: 700; padding: 10px; font-size: 0.9rem; }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    label { font-size: 0.8rem; font-weight: 700; color: var(--text-sub); }
    input, select { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; color: white; outline: none; transition: 0.2s; }
    input:focus, select:focus { border-color: var(--accent); }
    
    .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .avatar-option { font-size: 1.5rem; text-align: center; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 12px; cursor: pointer; border: 2px solid transparent; }
    .avatar-option.selected { border-color: var(--accent); background: rgba(99, 102, 241, 0.2); }
    
    .btn-primary { width: 100%; background: var(--accent-gradient); color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.4); display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-secondary-sm { background: none; border: none; color: var(--accent); font-size: 0.8rem; font-weight: 700; cursor: pointer; align-self: flex-end; margin-top: 4px; }

    .race-track { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .race-lane { display: flex; flex-direction: column; gap: 6px; }
    .race-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; }
    .race-bar-bg { width: 100%; background: rgba(0,0,0,0.3); height: 28px; border-radius: 14px; position: relative; overflow: hidden; }
    .race-bar-fill { height: 100%; background: var(--accent-gradient); border-radius: 14px; transition: width 1s ease-out; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 1rem; }
    .medal-1 { color: #fbbf24; } .medal-2 { color: #94a3b8; } .medal-3 { color: #b45309; }

    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--card-border); }
    .log-info { display: flex; flex-direction: column; gap: 4px; }
    .log-date { font-size: 0.8rem; color: var(--text-sub); }
    .log-dur { font-weight: 700; color: var(--accent); }
    .btn-del { background: rgba(244, 63, 94, 0.1); color: var(--red); border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.75rem; }
    .empty-msg { text-align: center; color: var(--text-sub); padding: 20px; font-size: 0.9rem; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(21, 31, 50, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--card-border); z-index: 1000; }
    .nav-btn { background: transparent; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.65rem; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">💪</div>
      <div class="brand-title">
        <h1>MyGym Status</h1>
      </div>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-ja" onclick="switchLang('ja')">JA</button>
      <button class="lang-btn" id="btn-es" onclick="switchLang('es')">ES</button>
    </div>
  </header>

  <div id="view-home" class="view active">
    <div class="card">
      <h2 style="font-size:0.9rem; margin-bottom:12px; color:var(--text-sub);" id="t-active-title">🔥 現在トレーニング中</h2>
      <div id="active-users-list" class="active-users">
        <div class="no-users" id="t-no-users">現在フリーです（誰も使っていません）</div>
      </div>
    </div>

    <div class="card">
      <div class="form-group" id="user-input-group">
        <label id="t-who">あなたはだれ？</label>
        <div id="returning-container" style="display:none;">
          <select id="userNameSelect"></select>
          <button class="btn-secondary-sm" onclick="enableNewUser()" id="t-btn-new-user">+ 別の名前・アバターを登録</button>
        </div>
        <div id="first-time-container">
          <input type="text" id="userNameInput" placeholder="名前を入力..." style="margin-bottom:10px;" />
          <label id="t-avatar">アバターを選択</label>
          <div class="avatar-grid" id="avatarSelector">
            <div class="avatar-option selected" onclick="selectAvatar(this, '🐶')">🐶</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🐱')">🐱</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🐰')">🐰</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🦊')">🦊</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🐻')">🐻</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🐼')">🐼</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🦁')">🦁</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🐸')">🐸</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🦖')">🦖</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🏎️')">🏎️</div>
            <div class="avatar-option" onclick="selectAvatar(this, '🚀')">🚀</div>
            <div class="avatar-option" onclick="selectAvatar(this, '👻')">👻</div>
          </div>
        </div>
      </div>
      <button class="btn-primary" onclick="startGym()" id="t-btn-start">スタート 🚀</button>
    </div>

    <div class="card">
      <h2 style="font-size:0.9rem; margin-bottom:12px; color:var(--text-sub);" id="t-race-title">🏆 今月のランキングレース</h2>
      <div style="margin-bottom: 20px;">
        <h3 style="font-size:0.8rem;" id="t-race-time">⏱️ 合計時間 (分)</h3>
        <div id="race-time" class="race-track"><div class="empty-msg">データなし</div></div>
      </div>
      <div>
        <h3 style="font-size:0.8rem;" id="t-race-count">🔥 利用回数</h3>
        <div id="race-count" class="race-track"><div class="empty-msg">データなし</div></div>
      </div>
    </div>
  </div>

  <div id="view-mypage" class="view">
    <div class="card">
      <h2 style="font-size:1rem; margin-bottom:16px;" id="t-my-title">👤 自分の記録を管理</h2>
      <select id="myPageUserSelect" onchange="renderMyLogs()" style="margin-bottom: 16px;">
        <option value="">ユーザーを選択...</option>
      </select>
      <div style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 16px; margin-bottom: 20px;">
        <h3 style="font-size: 0.85rem; margin-bottom: 10px;" id="t-manual-title">➕ 過去の記録を手動追加</h3>
        <div style="display:flex; gap:8px;">
          <input type="date" id="manualDate" style="flex:1; padding:12px;">
          <input type="number" id="manualMin" placeholder="分数" style="width:80px; padding:12px;">
          <button onclick="addManualLog()" id="t-btn-add" style="background:var(--accent); border:none; border-radius:12px; color:white; padding:0 16px; font-weight:700; cursor:pointer;">追加</button>
        </div>
      </div>
      <h3 style="font-size: 0.85rem; margin-bottom: 8px;" id="t-history-title">📅 今月の履歴</h3>
      <div id="my-logs-list" style="display:flex; flex-direction:column;">
        <div class="empty-msg" id="t-select-user">ユーザーを選択してください</div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span id="t-nav-home">ホーム</span>
    </button>
    <button class="nav-btn" id="nav-mypage" onclick="switchTab('mypage')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="t-nav-mypage">マイページ</span>
    </button>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwu8QoQvf3WUtAKAlvz8s2nbfNkcsGPEA",
      authDomain: "mygym-status.firebaseapp.com",
      databaseURL: "https://mygym-status-default-rtdb.firebaseio.com",
      projectId: "mygym-status",
      storageBucket: "mygym-status.firebasestorage.app",
      messagingSenderId: "541527735055",
      appId: "1:541527735055:web:9f14d9f742636abe261c7a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const i18n = {
      ja: {
        activeTitle: "🔥 現在トレーニング中", noUsers: "現在フリーです（誰も使っていません）",
        who: "あなたはだれ？", placeholderName: "名前を入力...", btnNewUser: "+ 別の名前・アバターを登録",
        avatar: "アバターを選択", btnStart: "スタート 🚀", raceTitle: "🏆 今月のランキングレース",
        raceTime: "⏱️ 合計時間 (分)", raceCount: "🔥 利用回数", emptyData: "データなし",
        myTitle: "👤 自分の記録を管理", selectUserOption: "ユーザーを選択...", selectUserMsg: "ユーザーを選択してください",
        manualTitle: "➕ 過去の記録を手動追加", btnAdd: "追加", historyTitle: "📅 今月の履歴",
        navHome: "ホーム", navMypage: "マイページ", unitMin: "分", unitCount: "回", elapsed: "分経過",
        btnStop: "終了", btnDelete: "削除", alertName: "名前を入力してください", alertAlready: "既に利用中になっています！",
        alertManual: "日付と正しい分数を入力してください", alertManualSuccess: "記録を追加しました！",
        confirmDelete: "この記録を削除しますか？", promptStopAlert: "⚠️ {min}分経過しています。\nストップボタンを押し忘れた場合は、実際の利用時間（分）を入力してください。"
      },
      es: {
        activeTitle: "🔥 Entrenando ahora", noUsers: "Nadie entrenando (Libre)",
        who: "¿Quién eres?", placeholderName: "Escribe tu nombre...", btnNewUser: "+ Registrar otro nombre",
        avatar: "Elige un avatar", btnStart: "Iniciar 🚀", raceTitle: "🏆 Clasificación Mensual",
        raceTime: "⏱️ Tiempo total (min)", raceCount: "🔥 Visitas", emptyData: "Sin datos",
        myTitle: "👤 Mis Registros", selectUserOption: "Selecciona usuario...", selectUserMsg: "Por favor, selecciona un usuario",
        manualTitle: "➕ Añadir registro manual", btnAdd: "Añadir", historyTitle: "📅 Historial del mes",
        navHome: "Inicio", navMypage: "Mi Perfil", unitMin: "min", unitCount: "visitas", elapsed: "min",
        btnStop: "Terminar", btnDelete: "Borrar", alertName: "Por favor escribe tu nombre", alertAlready: "¡Ya estás entrenando!",
        alertManual: "Ingresa una fecha y minutos válidos", alertManualSuccess: "¡Registro añadido!",
        confirmDelete: "¿Borrar este registro?", promptStopAlert: "⚠️ Han pasado {min} min.\nSi olvidaste detenerlo, ingresa los minutos reales:"
      }
    };

    let currentLang = localStorage.getItem("gym_lang") || "ja";
    let activeUsersData = {};
    let allLogsData = {};
    let selectedAvatar = "🐶";

    window.switchLang = (lang) => {
      currentLang = lang;
      localStorage.setItem("gym_lang", lang);
      document.getElementById("btn-ja").className = lang === "ja" ? "lang-btn active" : "lang-btn";
      document.getElementById("btn-es").className = lang === "es" ? "lang-btn active" : "lang-btn";
      updateI18n();
    };

    function updateI18n() {
      const t = i18n[currentLang];
      document.getElementById("t-active-title").innerText = t.activeTitle;
      document.getElementById("t-who").innerText = t.who;
      document.getElementById("userNameInput").placeholder = t.placeholderName;
      document.getElementById("t-btn-new-user").innerText = t.btnNewUser;
      document.getElementById("t-avatar").innerText = t.avatar;
      document.getElementById("t-btn-start").innerText = t.btnStart;
      document.getElementById("t-race-title").innerText = t.raceTitle;
      document.getElementById("t-race-time").innerText = t.raceTime;
      document.getElementById("t-race-count").innerText = t.raceCount;
      document.getElementById("t-my-title").innerText = t.myTitle;
      document.getElementById("t-manual-title").innerText = t.manualTitle;
      document.getElementById("t-btn-add").innerText = t.btnAdd;
      document.getElementById("t-history-title").innerText = t.historyTitle;
      document.getElementById("t-nav-home").innerText = t.navHome;
      document.getElementById("t-nav-mypage").innerText = t.navMypage;
      
      const myPageSelect = document.getElementById("myPageUserSelect");
      if (myPageSelect.options.length > 0 && myPageSelect.options[0].value === "") {
        myPageSelect.options[0].innerText = t.selectUserOption;
      }
      
      renderActiveUsers();
      renderRaceRanking();
      renderMyLogs();
    }

    window.switchTab = (tabId) => {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(`nav-${tabId}`).classList.add('active');
      document.getElementById(`view-${tabId}`).classList.add('active');
      if(tabId === 'mypage') updateMyPageSelect();
    };

    window.selectAvatar = (el, icon) => {
      document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatar = icon;
    };

    function getSavedUsers() { return JSON.parse(localStorage.getItem("gym_users") || "[]"); }
    function saveUser(name, avatar) {
      let users = getSavedUsers();
      let existing = users.find(u => u.name === name);
      if (existing) existing.avatar = avatar;
      else users.push({ name, avatar });
      localStorage.setItem("gym_users", JSON.stringify(users));
      localStorage.setItem("gym_last_user", name);
      setupUserUI();
    }

    function setupUserUI() {
      const users = getSavedUsers();
      const lastUser = localStorage.getItem("gym_last_user");
      const firstContainer = document.getElementById("first-time-container");
      const returningContainer = document.getElementById("returning-container");
      const select = document.getElementById("userNameSelect");

      if (users.length > 0) {
        firstContainer.style.display = "none";
        returningContainer.style.display = "block";
        select.innerHTML = users.map(u => `<option value="${u.name}" ${u.name === lastUser ? "selected" : ""}>${u.avatar} ${u.name}</option>`).join("");
      } else {
        firstContainer.style.display = "block";
        returningContainer.style.display = "none";
      }
    }

    window.enableNewUser = () => {
      document.getElementById("first-time-container").style.display = "block";
      document.getElementById("returning-container").style.display = "none";
      document.getElementById("userNameInput").value = "";
    };

    onValue(ref(db, "current"), (snapshot) => {
      activeUsersData = snapshot.val() || {};
      renderActiveUsers();
    });

    function renderActiveUsers() {
      const t = i18n[currentLang];
      const listEl = document.getElementById("active-users-list");
      
      // バグ修正：古い形式のデータや不正なデータを弾くガード機能
      const users = Object.entries(activeUsersData).filter(([name, data]) => {
        return data !== null && typeof data === 'object' && data.startTime;
      });
      
      if (users.length === 0) {
        listEl.innerHTML = `<div class="no-users">${t.noUsers}</div>`;
        return;
      }

      listEl.innerHTML = users.map(([name, data]) => {
        const elapsedMins = Math.floor((Date.now() - data.startTime) / 60000);
        return `
          <div class="active-user-row">
            <div class="active-user-info">
              <span class="avatar-icon">${data.avatar || "👤"}</span>
              <span>${name} <small style="color:var(--text-sub); font-weight:normal;">(${elapsedMins}${t.elapsed})</small></span>
            </div>
            <button class="btn-stop-sm" onclick="stopGym('${name}', ${data.startTime})">${t.btnStop}</button>
          </div>
        `;
      }).join("");
    }

    window.startGym = () => {
      const users = getSavedUsers();
      const t = i18n[currentLang];
      let name = "", avatar = "";

      if (users.length === 0 || document.getElementById("first-time-container").style.display !== "none") {
        name = document.getElementById("userNameInput").value.trim();
        avatar = selectedAvatar;
      } else {
        name = document.getElementById("userNameSelect").value;
        avatar = users.find(u => u.name === name)?.avatar || "👤";
      }

      if (!name) return alert(t.alertName);
      if (activeUsersData[name]) return alert(t.alertAlready);

      saveUser(name, avatar);
      set(ref(db, `current/${name}`), { startTime: Date.now(), avatar: avatar });
      document.getElementById("userNameInput").value = "";
    };

    window.stopGym = (name, startTime) => {
      const t = i18n[currentLang];
      let durationMin = Math.round((Date.now() - startTime) / 60000);
      
      // バグ修正：NaNになる場合は1分として処理
      if (isNaN(durationMin) || durationMin < 1) durationMin = 1;

      if (durationMin >= 180) {
        let msg = t.promptStopAlert.replace("{min}", durationMin);
        let manualInput = prompt(msg, "60");
        if (manualInput === null) return;
        let parsed = parseInt(manualInput, 10);
        if (!isNaN(parsed) && parsed > 0) durationMin = parsed;
      }

      push(ref(db, "logs"), {
        user: name,
        startTime: startTime,
        duration: durationMin,
        month: new Date().toISOString().slice(0, 7),
        date: new Date().toISOString()
      });
      remove(ref(db, `current/${name}`));
    };

    onValue(ref(db, "logs"), (snapshot) => {
      allLogsData = snapshot.val() || {};
      renderRaceRanking();
      if (document.getElementById('view-mypage').classList.contains('active')) {
        renderMyLogs();
      }
    });

    function renderRaceRanking() {
      const t = i18n[currentLang];
      const currentMonth = new Date().toISOString().slice(0, 7);
      const counts = {}; const times = {}; const avatars = {};
      const savedUsers = getSavedUsers();

      Object.values(allLogsData).forEach(log => {
        if (log.month === currentMonth) {
          counts[log.user] = (counts[log.user] || 0) + 1;
          times[log.user] = (times[log.user] || 0) + log.duration;
          avatars[log.user] = savedUsers.find(u => u.name === log.user)?.avatar || "👤";
        }
      });

      drawRace("race-time", times, avatars, t.unitMin);
      drawRace("race-count", counts, avatars, t.unitCount);
    }

    function drawRace(elementId, dataMap, avatars, unit) {
      const t = i18n[currentLang];
      const sorted = Object.entries(dataMap).sort((a, b) => b[1] - a[1]);
      const listEl = document.getElementById(elementId);
      if (sorted.length === 0) { listEl.innerHTML = `<div class="empty-msg">${t.emptyData}</div>`; return; }

      const maxVal = sorted[0][1];

      listEl.innerHTML = sorted.map(([user, val], idx) => {
        const percent = Math.max(10, (val / maxVal) * 100);
        let medal = "";
        if(idx===0) medal = '<span class="medal-1">🥇</span>';
        if(idx===1) medal = '<span class="medal-2">🥈</span>';
        if(idx===2) medal = '<span class="medal-3">🥉</span>';

        return `
          <div class="race-lane">
            <div class="race-header">
              <span>${medal} ${user}</span>
              <span style="color:var(--accent);">${val} ${unit}</span>
            </div>
            <div class="race-bar-bg">
              <div class="race-bar-fill" style="width: ${percent}%;">${avatars[user] || "👤"}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function updateMyPageSelect() {
      const t = i18n[currentLang];
      const users = getSavedUsers();
      const select = document.getElementById("myPageUserSelect");
      const lastUser = localStorage.getItem("gym_last_user");
      select.innerHTML = `<option value="">${t.selectUserOption}</option>` + 
        users.map(u => `<option value="${u.name}" ${u.name === lastUser ? "selected" : ""}>${u.name}</option>`).join("");
      renderMyLogs();
    }

    window.renderMyLogs = () => {
      const t = i18n[currentLang];
      const user = document.getElementById("myPageUserSelect").value;
      const listEl = document.getElementById("my-logs-list");
      if (!user) { listEl.innerHTML = `<div class="empty-msg">${t.selectUserMsg}</div>`; return; }

      const currentMonth = new Date().toISOString().slice(0, 7);
      const userLogs = Object.entries(allLogsData)
        .filter(([key, log]) => log.user === user && log.month === currentMonth)
        .sort((a, b) => new Date(b[1].date) - new Date(a[1].date));

      if (userLogs.length === 0) {
        listEl.innerHTML = `<div class="empty-msg">${t.emptyData}</div>`;
        return;
      }

      listEl.innerHTML = userLogs.map(([key, log]) => {
        const d = new Date(log.date);
        const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        return `
          <div class="log-item">
            <div class="log-info">
              <span class="log-date">${dateStr}</span>
              <span class="log-dur">${log.duration} ${t.unitMin}</span>
            </div>
            <button class="btn-del" onclick="deleteLog('${key}')">${t.btnDelete}</button>
          </div>
        `;
      }).join("");
    };

    window.addManualLog = () => {
      const t = i18n[currentLang];
      const user = document.getElementById("myPageUserSelect").value;
      const dateVal = document.getElementById("manualDate").value;
      const minVal = parseInt(document.getElementById("manualMin").value, 10);

      if (!user) return alert(t.selectUserMsg);
      if (!dateVal || !minVal || minVal <= 0) return alert(t.alertManual);

      const logDate = new Date(dateVal);
      logDate.setHours(12);

      push(ref(db, "logs"), {
        user: user,
        startTime: logDate.getTime(),
        duration: minVal,
        month: logDate.toISOString().slice(0, 7),
        date: logDate.toISOString()
      });

      document.getElementById("manualMin").value = "";
      alert(t.alertManualSuccess);
    };

    window.deleteLog = (key) => {
      const t = i18n[currentLang];
      if (confirm(t.confirmDelete)) {
        remove(ref(db, `logs/${key}`));
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      setupUserUI();
      switchLang(currentLang);
      setInterval(() => {
        if (Object.keys(activeUsersData).length > 0) renderActiveUsers();
      }, 60000);
    });
  </script>
</body>
</html>
