<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MyGym Status</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0D061A;
      --card-bg: #170C2E;
      --card-border: rgba(34, 197, 94, 0.2);
      --accent: #22C55E;
      --accent-gradient: linear-gradient(135deg, #22C55E, #10B981);
      --ring-outer: #22C55E;
      --ring-inner: #00F0FF;
      --green: #22C55E;
      --red: #F43F5E;
      --text-main: #F8FAFC;
      --text-sub: #A78BFA;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Zen Kaku Gothic New', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(34, 197, 94, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 197, 94, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text-main);
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px calc(90px + env(safe-area-inset-bottom));
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, .time-main, .btn-primary, .timer-action-btn, .stat-num {
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.03em;
    }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    
    .brand-logo-svg { width: 38px; height: 38px; filter: drop-shadow(0 0 8px rgba(34,197,94,0.5)); }
    .brand-title h1 { font-size: 1.3rem; font-weight: 800; color: #FFF; text-shadow: 0 0 10px rgba(34,197,94,0.5); }
    
    .lang-switcher { display: flex; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 3px; gap: 2px; }
    .lang-btn { background: none; border: none; color: var(--text-sub); padding: 6px 12px; font-size: 0.75rem; font-weight: 700; border-radius: 16px; cursor: pointer; transition: 0.2s; }
    .lang-btn.active { background: var(--accent); color: #0D061A; box-shadow: 0 0 10px var(--accent); }

    .view { display: none; flex-direction: column; gap: 16px; animation: fadeIn 0.3s ease-out; }
    .view.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
    .card::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(13, 6, 26, 0.95); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(8px); }
    .modal-content { width: 100%; max-width: 400px; }
    .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    label { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
    input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; color: white; outline: none; font-size: 1.1rem; text-align: center; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(34,197,94,0.3); }
    
    .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 160px; overflow-y: auto; padding-right: 4px; }
    .avatar-option { font-size: 1.5rem; text-align: center; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .avatar-option.selected { border-color: var(--accent); background: rgba(34,197,94,0.2); transform: scale(1.05); }
    
    .btn-primary { width: 100%; background: var(--accent-gradient); color: #0D061A; border: none; padding: 16px; border-radius: 16px; font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: 0 0 20px rgba(34,197,94,0.4); }
    .btn-secondary { width: 100%; background: rgba(34,197,94,0.1); color: var(--accent); border: 1px solid var(--card-border); padding: 12px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    
    .home-status-box { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 14px; text-align: center; margin-bottom: 10px; border: 1px solid var(--card-border); }
    .home-status-title { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .home-status-text { font-size: 1rem; font-weight: 700; color: white; }
    .status-free { color: var(--green); text-shadow: 0 0 8px rgba(34,197,94,0.4); }
    
    .timer-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0 20px; position: relative; }
    .progress-ring { transform: rotate(-90deg); filter: drop-shadow(0 0 10px rgba(34,197,94,0.2)); }
    .ring-track { fill: none; stroke: rgba(255,255,255,0.03); stroke-width: 14; }
    .ring-progress-outer { fill: none; stroke: var(--ring-outer); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
    .ring-progress-inner { fill: none; stroke: var(--ring-inner); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
    
    .timer-display { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; }
    .time-main { 
      font-size: 2.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; line-height: 1; color: #FFF; text-shadow: 0 0 15px rgba(255,255,255,0.4);
      font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    }
    .time-sub { font-size: 0.8rem; color: var(--text-sub); font-weight: 700; letter-spacing: 1px; }

    .timer-action-btn { background: rgba(34, 197, 94, 0.1); color: var(--green); border: 1px solid var(--card-border); padding: 14px 40px; border-radius: 16px; font-weight: 800; font-size: 1rem; cursor: pointer; box-shadow: 0 0 15px rgba(34,197,94,0.2); margin-top: 10px; transition: 0.2s; }
    .timer-action-btn.start { background: rgba(34, 197, 94, 0.15); color: var(--green); border-color: rgba(34, 197, 94, 0.4); }
    .timer-action-btn.stop { background: rgba(244, 63, 94, 0.15); color: var(--red); border-color: rgba(244, 63, 94, 0.4); box-shadow: 0 0 15px rgba(244,63,94,0.2); }

    /* カレンダービュー */
    .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .cal-title-month { font-size: 1.3rem; font-weight: 800; color: #FFF; font-family: 'Syne', sans-serif; text-transform: capitalize; }
    
    /* SVG化された月移動ボタン */
    .cal-nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: white; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .cal-nav-btn:hover { background: rgba(34,197,94,0.2); border-color: var(--accent); }
    .cal-nav-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-box { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; text-align: center; }
    .stat-num { font-size: 1.4rem; font-weight: 800; color: var(--ring-inner); text-shadow: 0 0 8px rgba(0,240,255,0.3); margin-top: 4px; }
    .stat-label { font-size: 0.7rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
    .cal-weekday { text-align: center; font-size: 0.75rem; color: var(--text-sub); font-weight: 700; padding-bottom: 4px; }
    .cal-day { aspect-ratio: 1; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.04); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; position: relative; }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-day.has-activity { background: linear-gradient(135deg, rgba(34,197,94,0.25), rgba(0,240,255,0.25)); border-color: var(--accent); color: #FFF; box-shadow: 0 0 8px rgba(34,197,94,0.3); }
    .cal-day.selected { border: 2px solid #FFF; transform: scale(1.05); }

    .cal-detail-card { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .cal-detail-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 8px; }
    .cal-detail-date { font-size: 0.85rem; color: var(--text-sub); font-weight: 700; }
    .cal-user-log-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; font-weight: 700; }

    .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 16px; letter-spacing: 0.05em; color: #FFF; }
    .profile-header { display: flex; align-items: center; gap: 16px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--card-border); }
    .profile-avatar { font-size: 2.5rem; background: rgba(255,255,255,0.05); width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 16px; border: 1px solid var(--card-border); }
    .profile-name { font-size: 1.4rem; font-weight: 800; }

    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .list-item:last-child { border-bottom: none; }
    .list-date { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
    .list-title { font-weight: 700; color: #FFF; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
    .list-val { font-weight: 800; color: var(--accent); font-size: 1rem; text-shadow: 0 0 8px rgba(34,197,94,0.3); }
    .btn-del { background: rgba(244, 63, 94, 0.15); color: var(--red); border: 1px solid rgba(244,63,94,0.3); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.75rem; }
    .empty-msg { text-align: center; color: var(--text-sub); padding: 20px; font-size: 0.9rem; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13, 6, 26, 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--card-border); z-index: 1000; }
    .nav-btn { background: transparent; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.65rem; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: 0.2s; }
    .nav-btn.active svg { transform: translateY(-2px); filter: drop-shadow(0 0 6px var(--accent)); }
  </style>
</head>
<body>

  <!-- 初回登録モーダル -->
  <div id="auth-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content card">
      <h2 style="text-align:center; margin-bottom: 20px; font-size: 1.5rem;" id="t-modal-title">Bienvenido</h2>
      <div class="form-group">
        <label id="t-modal-name">Tu nombre</label>
        <input type="text" id="regNameInput" placeholder="Name" />
      </div>
      <div class="form-group">
        <label id="t-modal-avatar">Avatar</label>
        <div class="avatar-grid" id="modal-avatar-grid"></div>
      </div>
      <button class="btn-primary" onclick="registerUser()" id="t-btn-register">Comenzar 🚀</button>
    </div>
  </div>

  <!-- プロフィール編集モーダル -->
  <div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content card">
      <h2 style="text-align:center; margin-bottom: 20px; font-size: 1.5rem;" id="t-edit-title">Editar Perfil</h2>
      <div class="form-group">
        <label id="t-edit-name">Tu nombre</label>
        <input type="text" id="editNameInput" />
      </div>
      <div class="form-group">
        <label id="t-edit-avatar">Avatar</label>
        <div class="avatar-grid" id="edit-avatar-grid"></div>
      </div>
      <button class="btn-primary" onclick="saveEditedProfile()" id="t-btn-save">Guardar</button>
      <button class="btn-secondary" onclick="closeEditModal()" id="t-btn-cancel">Cancelar</button>
    </div>
  </div>

  <header>
    <div class="brand">
      <svg class="brand-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="24" fill="#170C2E" stroke="#22C55E" stroke-width="4"/>
        <path d="M30 50L45 30H70L55 50H70L40 75L48 55H30Z" fill="url(#paint0_linear)" stroke="#00F0FF" stroke-width="3" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="paint0_linear" x1="30" y1="30" x2="70" y2="75" gradientUnits="userSpaceOnUse">
            <stop stop-color="#22C55E"/>
            <stop offset="1" stop-color="#00F0FF"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="brand-title">
        <h1>MyGym</h1>
      </div>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-es" onclick="switchLang('es')">ES</button>
      <button class="lang-btn" id="btn-ja" onclick="switchLang('ja')">JA</button>
    </div>
  </header>

  <!-- 🏠 ホームビュー -->
  <div id="view-home" class="view active">
    
    <div class="home-status-box">
      <div class="home-status-title" id="t-home-status-label">Estado Actual</div>
      <div class="home-status-text status-free" id="home-status-text">Libre</div>
    </div>

    <div class="timer-container">
      <svg class="progress-ring" width="260" height="260">
        <circle class="ring-track" cx="130" cy="130" r="110" />
        <circle class="ring-progress-outer" id="ring-outer" cx="130" cy="130" r="110" stroke-dasharray="691.15" stroke-dashoffset="691.15" />
        <circle class="ring-track" cx="130" cy="130" r="86" />
        <circle class="ring-progress-inner" id="ring-inner" cx="130" cy="130" r="86" stroke-dasharray="540.35" stroke-dashoffset="540.35" />
      </svg>
      
      <div class="timer-display">
        <div class="time-main" id="time-text">00:00</div>
        <div class="time-sub">MM:SS</div>
      </div>
    </div>

    <div style="text-align: center;">
      <button id="btn-timer-action" class="timer-action-btn start" onclick="toggleTimer()">START</button>
    </div>
  </div>

  <!-- 📅 カレンダービュー -->
  <div id="view-calendar" class="view">
    <div class="card">
      <div class="cal-header-row">
        <!-- SVGの月移動ボタン -->
        <button class="cal-nav-btn" onclick="changeMonth(-1)">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="cal-title-month" id="cal-month-title">agosto 2026</div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label" id="t-stat-days">Días de entrenamiento</div>
          <div class="stat-num" id="stat-days-val">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label" id="t-stat-time">Tiempo total</div>
          <div class="stat-num" id="stat-time-val">0 min</div>
        </div>
      </div>

      <div class="calendar-grid" style="margin-bottom: 6px;">
        <div class="cal-weekday">D</div>
        <div class="cal-weekday">L</div>
        <div class="cal-weekday">M</div>
        <div class="cal-weekday">M</div>
        <div class="cal-weekday">J</div>
        <div class="cal-weekday">V</div>
        <div class="cal-weekday">S</div>
      </div>

      <div class="calendar-grid" id="calendar-days-container"></div>

      <div class="cal-detail-card" id="cal-selected-detail">
        <div class="cal-detail-header">
          <div class="cal-detail-date" id="selected-date-text">Selecciona un día</div>
          <div id="selected-date-total-badge" style="font-weight:800; color:var(--accent); font-family:'Syne';">0 min</div>
        </div>
        <div id="selected-date-users-list" style="display:flex; flex-direction:column; gap:6px;">
          <div style="color:var(--text-sub); font-size:0.9rem;">Sin registros</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 🏆 ランキングビュー -->
  <div id="view-ranking" class="view">
    <div class="card">
      <h2 class="section-title" id="t-race-title">🏆 Ranking Mensual</h2>
      <div>
        <h3 style="font-size:0.85rem; color:var(--text-sub); margin-bottom:8px;" id="t-race-count">🔥 Visitas</h3>
        <div id="race-count" style="display:flex; flex-direction:column;"><div class="empty-msg">Sin datos</div></div>
      </div>
    </div>
  </div>

  <!-- 👤 マイページビュー -->
  <div id="view-mypage" class="view">
    <div class="card">
      
      <div class="profile-header">
        <div class="profile-avatar" id="my-avatar-display">👤</div>
        <div style="display:flex; flex-direction:column; gap:4px; flex:1;">
          <div class="profile-name" id="my-name-display">Name</div>
          <button onclick="openEditModal()" style="background:rgba(34,197,94,0.15); border:1px solid var(--card-border); color:var(--accent); padding:4px 10px; border-radius:8px; font-weight:700; font-size:0.75rem; cursor:pointer; width:fit-content;" id="t-edit-profile-btn">Editar Perfil</button>
        </div>
      </div>
      
      <div style="background: rgba(0,0,0,0.3); padding: 16px; border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--card-border);">
        <h3 style="font-size: 0.85rem; color:var(--text-sub); margin-bottom: 12px;" id="t-manual-title">➕ Añadir registro manual</h3>
        <div style="display:flex; gap:8px;">
          <input type="date" id="manualDate" style="flex:1; padding:12px; background:rgba(0,0,0,0.4); border:1px solid var(--card-border); border-radius: 12px; color: white;">
          <input type="number" id="manualMin" placeholder="Min" style="width:70px; padding:12px; background:rgba(0,0,0,0.4); border:1px solid var(--card-border); border-radius: 12px; color: white;">
          <button onclick="addManualLog()" id="t-btn-add" style="background:var(--accent-gradient); border:none; border-radius:12px; color:#0D061A; padding:0 16px; font-weight:800; cursor:pointer;">Añadir</button>
        </div>
      </div>

      <h3 style="font-size: 0.85rem; color:var(--text-sub); margin-bottom: 8px;" id="t-history-title">📅 Mi Historial</h3>
      <div id="my-logs-list" style="display:flex; flex-direction:column;">
        <div class="empty-msg">Sin datos</div>
      </div>
      
      <div style="margin-top: 30px; text-align: center;">
        <button onclick="resetUser()" style="background:transparent; border:none; color:var(--text-sub); font-size:0.8rem; cursor:pointer; text-decoration:underline;" id="t-logout">Cerrar sesión</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="t-nav-home">Inicio</span>
    </button>
    <button class="nav-btn" id="nav-calendar" onclick="switchTab('calendar')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="t-nav-cal">Calendario</span>
    </button>
    <button class="nav-btn" id="nav-ranking" onclick="switchTab('ranking')">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
      <span id="t-nav-ranking">Ranking</span>
    </button>
    <button class="nav-btn" id="nav-mypage" onclick="switchTab('mypage')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="t-nav-mypage">Perfil</span>
    </button>
  </nav>

  <script type="module">

    const AVATAR_LIST = [

    function renderAvatarSelectors() {
      const html = AVATAR_LIST.map((icon, idx) => `<div class="avatar-option ${idx===0?'selected':''}" onclick="selectAvatarOption(this, '${icon}')">${icon}</div>`).join("");
      document.getElementById("modal-avatar-grid").innerHTML = html;
      document.getElementById("edit-avatar-grid").innerHTML = html;
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'start') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'stop') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(440, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        }
      } catch (e) {}
    }

    function setT(id, text) {
      const el = document.getElementById(id);
      if (el) el.innerText = text;
    }

    const i18n = {
      es: {
        modalTitle: "Bienvenido", modalName: "Tu nombre", modalAvatar: "Avatar", btnRegister: "Comenzar 🚀",
        editTitle: "Editar Perfil", editName: "Tu nombre", editAvatar: "Avatar", btnSave: "Guardar", btnCancel: "Cancelar", editBtn: "Editar Perfil",
        homeStatusLabel: "Estado Actual", statusFree: "Libre (Nadie entrenando)", statusBusy: "está entrenando", statusMulti: "personas entrenando",
        btnStart: "EMPEZAR", btnStop: "TERMINAR",
        statDays: "Días de entrenamiento", statTime: "Tiempo total", selectDayMsg: "Selecciona un día",
        raceTitle: "🏆 Ranking Mensual", raceCount: "🔥 Visitas", emptyData: "Sin datos",
        myTitle: "👤 Mi Perfil", manualTitle: "➕ Añadir registro manual", btnAdd: "Añadir", historyTitle: "📅 Mi Historial", logout: "Cerrar sesión",
        navHome: "Inicio", navCal: "Calendario", navRanking: "Ranking", navMypage: "Perfil",
        unitMin: "min", unitHour: "h", unitCount: "visitas", btnDelete: "Borrar",
        alertName: "Por favor escribe tu nombre", alertAlready: "¡Ya estás entrenando!",
        alertManual: "Ingresa una fecha y minutos válidos", confirmDelete: "¿Borrar este registro?",
        promptStopAlert: "⚠️ Han pasado {min} min.\nSi olvidaste detenerlo, ingresa los minutos reales:",
        months: ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"]
      },
      ja: {
        modalTitle: "ようこそ", modalName: "あなたの名前", modalAvatar: "アバター", btnRegister: "はじめる 🚀",
        editTitle: "プロフィール編集", editName: "あなたの名前", editAvatar: "アバター", btnSave: "保存する", btnCancel: "キャンセル", editBtn: "プロフィール編集",
        homeStatusLabel: "現在のステータス", statusFree: "現在フリーです", statusBusy: "さんがトレーニング中", statusMulti: "人がトレーニング中",
        btnStart: "スタート", btnStop: "ストップ",
        statDays: "トレーニング日数", statTime: "今月の合計時間", selectDayMsg: "カレンダーの日付を選択",
        raceTitle: "🏆 今月のランキング", raceCount: "🔥 利用回数", emptyData: "データなし",
        myTitle: "👤 マイページ", manualTitle: "➕ 過去の記録を手動追加", btnAdd: "追加", historyTitle: "📅 今月の履歴", logout: "ログアウト (リセット)",
        navHome: "タイマー", navCal: "カレンダー", navRanking: "ランキング", navMypage: "マイページ",
        unitMin: "分", unitHour: "時間", unitCount: "回", btnDelete: "削除",
        alertName: "名前を入力してください", alertAlready: "既に利用中になっています！",
        alertManual: "日付と正しい分数を入力してください", confirmDelete: "この記録を削除しますか？",
        promptStopAlert: "⚠️ {min}分経過しています。\n押し忘れた場合は実際の利用時間（分）を入力してください。",
        months: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"]
      }
    };

    let currentLang = localStorage.getItem("gym_lang") || "es";
    let activeUsersData = {};
    let allLogsData = {};
    let selectedAvatar = "🐶";
    let editSelectedAvatar = "🐶";
    let myUserName = localStorage.getItem("gym_my_name") || "";
    let myUserAvatar = localStorage.getItem("gym_my_avatar") || "";
    let amIRunning = false;
    
    let calendarDate = new Date();
    let selectedDateStr = new Date().toISOString().slice(0, 10);
    
    let timerAnimationId;
    const CIRCUMFERENCE_OUTER = 691.15;
    const CIRCUMFERENCE_INNER = 540.35;
    const SECONDS_1HR = 3600;
    const SECONDS_10MIN = 600;

    window.switchLang = (lang) => {
      playSound('click');
      currentLang = lang;
      localStorage.setItem("gym_lang", lang);
      document.getElementById("btn-es").className = lang === "es" ? "lang-btn active" : "lang-btn";
      document.getElementById("btn-ja").className = lang === "ja" ? "lang-btn active" : "lang-btn";
      updateI18n();
    };

    function updateI18n() {
      const t = i18n[currentLang];
      setT("t-modal-title", t.modalTitle);
      setT("t-modal-name", t.modalName);
      setT("t-modal-avatar", t.modalAvatar);
      setT("t-btn-register", t.btnRegister);
      setT("t-edit-title", t.editTitle);
      setT("t-edit-name", t.editName);
      setT("t-edit-avatar", t.editAvatar);
      setT("t-btn-save", t.btnSave);
      setT("t-btn-cancel", t.btnCancel);
      setT("t-edit-profile-btn", t.editBtn);
      setT("t-home-status-label", t.homeStatusLabel);
      setT("t-stat-days", t.statDays);
      setT("t-stat-time", t.statTime);
      setT("t-race-title", t.raceTitle);
      setT("t-race-count", t.raceCount);
      setT("t-my-title", t.myTitle);
      setT("t-manual-title", t.manualTitle);
      setT("t-btn-add", t.btnAdd);
      setT("t-history-title", t.historyTitle);
      setT("t-logout", t.logout);
      setT("t-nav-home", t.navHome);
      setT("t-nav-cal", t.navCal);
      setT("t-nav-ranking", t.navRanking);
      setT("t-nav-mypage", t.navMypage);
      
      const btnAction = document.getElementById("btn-timer-action");
      if(btnAction) btnAction.innerText = amIRunning ? t.btnStop : t.btnStart;
      
      updateHomeStatusText();
      renderCalendar();
      renderRaceRanking();
      if(myUserName) renderMyLogs();
    }

    window.switchTab = (tabId) => {
      playSound('click');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(`nav-${tabId}`).classList.add('active');
      document.getElementById(`view-${tabId}`).classList.add('active');
      if(tabId === 'mypage' && myUserName) renderMyLogs();
      if(tabId === 'calendar') renderCalendar();
    };

    window.selectAvatarOption = (el, icon) => {
      playSound('click');
      const parent = el.closest('#modal-avatar-grid');
      if (parent) {
        parent.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedAvatar = icon;
      } else {
        document.querySelectorAll('#edit-avatar-grid .avatar-option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        editSelectedAvatar = icon;
      }
    };

    function checkAuth() {
      if (!myUserName) {
        document.getElementById("auth-modal").style.display = "flex";
      } else {
        document.getElementById("auth-modal").style.display = "none";
        document.getElementById("my-name-display").innerText = myUserName;
        document.getElementById("my-avatar-display").innerText = myUserAvatar;
        checkMyTimerStatus();
      }
    }

    window.registerUser = () => {
      playSound('start');
      const name = document.getElementById("regNameInput").value.trim();
      if (!name) return alert(i18n[currentLang].alertName);
      
      myUserName = name;
      myUserAvatar = selectedAvatar;
      localStorage.setItem("gym_my_name", name);
      localStorage.setItem("gym_my_avatar", selectedAvatar);
      
      document.getElementById("my-name-display").innerText = myUserName;
      document.getElementById("my-avatar-display").innerText = myUserAvatar;
      document.getElementById("auth-modal").style.display = "none";
      
      checkMyTimerStatus();
      renderMyLogs();
    };

    window.openEditModal = () => {
      playSound('click');
      document.getElementById("editNameInput").value = myUserName;
      editSelectedAvatar = myUserAvatar;
      
      document.querySelectorAll('#edit-avatar-grid .avatar-option').forEach(opt => {
        if (opt.innerText === myUserAvatar) opt.classList.add('selected');
        else opt.classList.remove('selected');
      });

      document.getElementById("edit-modal").style.display = "flex";
    };

    window.closeEditModal = () => {
      playSound('click');
      document.getElementById("edit-modal").style.display = "none";
    };

    window.saveEditedProfile = () => {
      playSound('start');
      const newName = document.getElementById("editNameInput").value.trim();
      if (!newName) return alert(i18n[currentLang].alertName);

      if (activeUsersData[myUserName]) {
        set(ref(db, `current/${newName}`), { startTime: activeUsersData[myUserName].startTime, avatar: editSelectedAvatar });
        remove(ref(db, `current/${myUserName}`));
      }

      myUserName = newName;
      myUserAvatar = editSelectedAvatar;
      localStorage.setItem("gym_my_name", myUserName);
      localStorage.setItem("gym_my_avatar", myUserAvatar);

      document.getElementById("my-name-display").innerText = myUserName;
      document.getElementById("my-avatar-display").innerText = myUserAvatar;
      document.getElementById("edit-modal").style.display = "none";
      
      renderRaceRanking();
      renderCalendar();
      renderMyLogs();
    };

    window.resetUser = () => {
      playSound('click');
      localStorage.removeItem("gym_my_name");
      localStorage.removeItem("gym_my_avatar");
      location.reload();
    };

    function formatTimeFriendly(totalMinutes) {
      const t = i18n[currentLang];
      if (totalMinutes < 60) return `${totalMinutes} ${t.unitMin}`;
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return m > 0 ? `${h}${t.unitHour} ${m}${t.unitMin}` : `${h}${t.unitHour}`;
    }

    function updateTimerUI(startTime) {
      const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
      const mins = Math.floor(elapsedSec / 60);
      const secs = (elapsedSec % 60).toString().padStart(2, '0');
      document.getElementById("time-text").innerText = `${mins.toString().padStart(2,'0')}:${secs}`;

      const outerProgress = (elapsedSec % SECONDS_1HR) / SECONDS_1HR;
      const innerProgress = (elapsedSec % SECONDS_10MIN) / SECONDS_10MIN;
      document.getElementById("ring-outer").style.strokeDashoffset = CIRCUMFERENCE_OUTER - (outerProgress * CIRCUMFERENCE_OUTER);
      document.getElementById("ring-inner").style.strokeDashoffset = CIRCUMFERENCE_INNER - (innerProgress * CIRCUMFERENCE_INNER);

      timerAnimationId = requestAnimationFrame(() => updateTimerUI(startTime));
    }

    function checkMyTimerStatus() {
      if (!myUserName) return;
      const myData = activeUsersData[myUserName];
      const btnAction = document.getElementById("btn-timer-action");
      const t = i18n[currentLang];

      if (myData && myData.startTime) {
        amIRunning = true;
        btnAction.innerText = t.btnStop;
        btnAction.className = "timer-action-btn stop";
        if (!timerAnimationId) updateTimerUI(myData.startTime);
      } else {
        amIRunning = false;
        btnAction.innerText = t.btnStart;
        btnAction.className = "timer-action-btn start";
        cancelAnimationFrame(timerAnimationId);
        timerAnimationId = null;
        document.getElementById("time-text").innerText = "00:00";
        document.getElementById("ring-outer").style.strokeDashoffset = CIRCUMFERENCE_OUTER;
        document.getElementById("ring-inner").style.strokeDashoffset = CIRCUMFERENCE_INNER;
      }
    }

    window.toggleTimer = () => {
      if (!myUserName) return checkAuth();
      if (amIRunning) {
        playSound('stop');
        const startTime = activeUsersData[myUserName].startTime;
        let durationMin = Math.round((Date.now() - startTime) / 60000);
        if (isNaN(durationMin) || durationMin < 1) durationMin = 1;

        if (durationMin >= 180) {
          let msg = i18n[currentLang].promptStopAlert.replace("{min}", durationMin);
          let manualInput = prompt(msg, "60");
          if (manualInput === null) return;
          let parsed = parseInt(manualInput, 10);
          if (!isNaN(parsed) && parsed > 0) durationMin = parsed;
        }

        push(ref(db, "logs"), {
          user: myUserName,
          avatar: myUserAvatar,
          startTime: startTime,
          duration: durationMin,
          month: new Date().toISOString().slice(0, 7),
          date: new Date().toISOString()
        });
        remove(ref(db, `current/${myUserName}`));
      } else {
        playSound('start');
        set(ref(db, `current/${myUserName}`), { startTime: Date.now(), avatar: myUserAvatar });
      }
    };

    function updateHomeStatusText() {
      const t = i18n[currentLang];
      const statusEl = document.getElementById("home-status-text");
      const users = Object.keys(activeUsersData);
      
      if (users.length === 0) {
        statusEl.innerText = t.statusFree;
        statusEl.className = "home-status-text status-free";
      } else if (users.length === 1) {
        const u = users[0];
        statusEl.innerText = currentLang === 'es' ? `${u} ${t.statusBusy}` : `${u}${t.statusBusy}`;
        statusEl.className = "home-status-text";
        statusEl.style.color = "var(--ring-outer)";
      } else {
        statusEl.innerText = currentLang === 'es' ? `${users.length} ${t.statusMulti}` : `${users.length}${t.statusMulti}`;
        statusEl.className = "home-status-text";
        statusEl.style.color = "var(--ring-outer)";
      }
    }

    onValue(ref(db, "current"), (snapshot) => {
      activeUsersData = snapshot.val() || {};
      Object.keys(activeUsersData).forEach(key => {
        if (!activeUsersData[key] || !activeUsersData[key].startTime) delete activeUsersData[key];
      });
      updateHomeStatusText();
      checkMyTimerStatus();
    });

    onValue(ref(db, "logs"), (snapshot) => {
      allLogsData = snapshot.val() || {};
      renderRaceRanking();
      if (document.getElementById('view-calendar').classList.contains('active')) renderCalendar();
      if (document.getElementById('view-mypage').classList.contains('active')) renderMyLogs();
    });

    window.changeMonth = (direction) => {
      playSound('click');
      calendarDate.setMonth(calendarDate.getMonth() + direction);
      renderCalendar();
    };

    function renderCalendar() {
      const t = i18n[currentLang];
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      
      const monthNames = t.months;
      document.getElementById("cal-month-title").innerText = `${monthNames[month]} ${year}`;

      const monthStr = `${year}-${(month + 1).toString().padStart(2, '0')}`;
      const dayLogs = {}; 
      let totalMonthMin = 0;
      const trainedDaysSet = new Set();

      Object.values(allLogsData).forEach(log => {
        if (log.date && log.date.startsWith(monthStr)) {
          const dateKey = log.date.slice(0, 10);
          if (!dayLogs[dateKey]) dayLogs[dateKey] = [];
          dayLogs[dateKey].push(log);
          totalMonthMin += log.duration;
          trainedDaysSet.add(dateKey);
        }
      });

      document.getElementById("stat-days-val").innerText = trainedDaysSet.size;
      document.getElementById("stat-time-val").innerText = formatTimeFriendly(totalMonthMin);

      const container = document.getElementById("calendar-days-container");
      container.innerHTML = "";

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "cal-day empty";
        container.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dayStr = day.toString().padStart(2, '0');
        const monthStrCell = (month + 1).toString().padStart(2, '0');
        const dateKey = `${year}-${monthStrCell}-${dayStr}`;

        const cell = document.createElement("div");
        cell.className = "cal-day";
        if (trainedDaysSet.has(dateKey)) cell.classList.add("has-activity");
        if (dateKey === selectedDateStr) cell.classList.add("selected");

        cell.innerText = day;
        cell.onclick = (e) => {
          playSound('click');
          selectCalendarDay(dateKey, dayLogs[dateKey] || [], e.currentTarget);
        };
        container.appendChild(cell);
      }

      selectCalendarDay(selectedDateStr, dayLogs[selectedDateStr] || [], null, false);
    }

    function selectCalendarDay(dateKey, logsForDay, clickedEl, updateSelectionState = true) {
      if (updateSelectionState) {
        selectedDateStr = dateKey;
        document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
        if (clickedEl) clickedEl.classList.add('selected');
      }

      const t = i18n[currentLang];
      const dateTextEl = document.getElementById("selected-date-text");
      const usersListEl = document.getElementById("selected-date-users-list");
      const totalBadgeEl = document.getElementById("selected-date-total-badge");

      const [y, m, d] = dateKey.split('-');
      dateTextEl.innerText = currentLang === 'es' ? `${d}/${m}/${y}` : `${m}月${d}日`;

      if (logsForDay.length === 0) {
        usersListEl.innerHTML = `<div style="color:var(--text-sub); font-size:0.9rem;">Sin registros</div>`;
        totalBadgeEl.innerText = `0 ${t.unitMin}`;
      } else {
        let totalMin = 0;
        let userSummary = {};
        
        logsForDay.forEach(l => {
          totalMin += l.duration;
          if (!userSummary[l.user]) userSummary[l.user] = { avatar: l.avatar || "👤", min: 0 };
          userSummary[l.user].min += l.duration;
        });

        totalBadgeEl.innerText = formatTimeFriendly(totalMin);

        usersListEl.innerHTML = Object.entries(userSummary).map(([user, data]) => `
          <div class="cal-user-log-row">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:1.2rem;">${data.avatar}</span>
              <span style="color:#FFF;">${user}</span>
            </div>
            <span style="color:var(--ring-inner); font-weight:800;">${formatTimeFriendly(data.min)}</span>
          </div>
        `).join("");
      }
    }

    function renderRaceRanking() {
      const t = i18n[currentLang];
      const currentMonth = new Date().toISOString().slice(0, 7);
      const counts = {}; 

      Object.values(allLogsData).forEach(log => {
        if (log.month === currentMonth) {
          counts[log.user] = (counts[log.user] || 0) + 1;
        }
      });

      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const listEl = document.getElementById("race-count");
      
      if (sorted.length === 0) { 
        listEl.innerHTML = `<div class="empty-msg">${t.emptyData}</div>`; 
        return; 
      }

      listEl.innerHTML = sorted.map(([user, val], idx) => {
        let rankIcon = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : "👤";
        return `
          <div class="list-item" style="padding: 18px 0;">
            <div class="list-title"><span style="font-size:1.3rem;">${rankIcon}</span> ${user}</div>
            <div class="list-val">${val} ${t.unitCount}</div>
          </div>
        `;
      }).join("");
    }

    window.renderMyLogs = () => {
      const t = i18n[currentLang];
      const listEl = document.getElementById("my-logs-list");
      if (!myUserName) return;

      const currentMonth = new Date().toISOString().slice(0, 7);
      const userLogs = Object.entries(allLogsData)
        .filter(([key, log]) => log.user === myUserName && log.month === currentMonth)
        .sort((a, b) => new Date(b[1].date) - new Date(a[1].date));

      if (userLogs.length === 0) {
        listEl.innerHTML = `<div class="empty-msg">${t.emptyData}</div>`;
        return;
      }

      listEl.innerHTML = userLogs.map(([key, log]) => {
        const d = new Date(log.date);
        const dateStr = currentLang === 'es' 
            ? `${d.getDate()}/${d.getMonth()+1} - ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`
            : `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            
        return `
          <div class="list-item">
            <div>
              <div class="list-date">${dateStr}</div>
              <div class="list-title" style="color:white;">${log.duration} ${t.unitMin}</div>
            </div>
            <button class="btn-del" onclick="deleteLog('${key}')">${t.btnDelete}</button>
          </div>
        `;
      }).join("");
    };

    window.addManualLog = () => {
      playSound('click');
      const t = i18n[currentLang];
      if (!myUserName) return;
      
      const dateVal = document.getElementById("manualDate").value;
      const minVal = parseInt(document.getElementById("manualMin").value, 10);

      if (!dateVal || !minVal || minVal <= 0) return alert(t.alertManual);

      const logDate = new Date(dateVal);
      logDate.setHours(12);

      push(ref(db, "logs"), {
        user: myUserName,
        avatar: myUserAvatar,
        startTime: logDate.getTime(),
        duration: minVal,
        month: logDate.toISOString().slice(0, 7),
        date: logDate.toISOString()
      });

      document.getElementById("manualMin").value = "";
    };

    window.deleteLog = (key) => {
      playSound('click');
      const t = i18n[currentLang];
      if (confirm(t.confirmDelete)) {
        remove(ref(db, `logs/${key}`));
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      renderAvatarSelectors();
      switchLang(currentLang);
      checkAuth();
    });
  </script>
</body>
</html>
