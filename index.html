<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gimnasio Familiar / ファミリージム</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.12);
      --red: #f43f5e;
      --red-bg: rgba(244, 63, 94, 0.12);
      --text-main: #f8fafc;
      --text-sub: #64748b;
      --svg-color: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    svg {
      vertical-align: middle;
      flex-shrink: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: var(--accent-gradient);
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
      color: white;
    }

    .brand-title h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .lang-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border-radius: 16px;
      transition: all 0.3s;
    }

    .status-badge.free {
      background: var(--green-bg);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-badge.busy {
      background: var(--red-bg);
      border: 1px solid rgba(244, 63, 94, 0.2);
    }

    .status-dot-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-badge.free .status-dot {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .status-badge.busy .status-dot {
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }

    .status-badge.busy .status-dot-wrap::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--red);
      opacity: 0.4;
      animation: ripple 1.8s infinite ease-out;
    }

    @keyframes ripple {
      0% { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .status-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-sub);
      font-weight: 700;
    }

    .status-val {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .timer {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-secondary-sm {
      background: transparent;
      border: none;
      color: var(--accent);
      padding: 4px 0;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-danger {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      box-shadow: 0 8px 24px -4px rgba(244, 63, 94, 0.4);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ranking-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ranking-block {
      background: rgba(9, 13, 22, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 14px;
    }

    .ranking-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    ol {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--card-bg);
      border-radius: 12px;
      font-size: 0.9rem;
      border: 1px solid var(--card-border);
    }

    li:nth-child(1) { border-left: 3px solid #f59e0b; }
    li:nth-child(2) { border-left: 3px solid #94a3b8; }
    li:nth-child(3) { border-left: 3px solid #b45309; }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-num {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-sub);
      width: 14px;
    }

    .rank-name { font-weight: 600; }
    .rank-val { font-weight: 700; color: var(--accent); font-size: 0.85rem; }

    .empty-msg {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1 1a2 2 0 0 1-2.83 0l-2.5-2.5a2 2 0 0 1 0-2.83l.83-.83"/><path d="M11 11 8.5 8.5a2 2 0 0 0-2.83 0l-.83.83a2 2 0 0 0 0 2.83l2.5 2.5a2 2 0 0 0 2.83 0l1-1"/><path d="m3 3 1-1a2 2 0 0 1 2.83 0l2.5 2.5a2 2 0 0 1 0 2.83l-.83.83"/><path d="m13 13 2.5-2.5a2 2 0 0 1 2.83 0l.83.83a2 2 0 0 1 0 2.83l-2.5 2.5a2 2 0 0 1-2.83 0l-1-1"/></svg>
      </div>
      <div class="brand-title">
        <h1>Gimnasio</h1>
        <p>Gimnasio Familiar</p>
      </div>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" id="btn-es" onclick="switchLang('es')">ES</button>
      <button class="lang-btn" id="btn-ja" onclick="switchLang('ja')">JA</button>
    </div>
  </header>

  <div class="card">
    <div id="status" class="status-badge free">
      <div class="status-dot-wrap"><div class="status-dot"></div></div>
      <div class="status-info">
        <span class="status-title" id="t-status-title">Estado Actual</span>
        <span class="status-val" id="t-status-val">Cargando...</span>
        <span class="timer" id="status-timer" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="timer-text">0m 00s</span>
        </span>
      </div>
    </div>

    <div class="form-group" id="user-input-group">
      <label id="t-label-user">¿Quién eres?</label>
      
      <div id="first-time-container">
        <input type="text" id="userNameInput" placeholder="Escribe tu nombre..." />
      </div>

      <div id="returning-container" style="display:none;">
        <select id="userNameSelect"></select>
        <button class="btn-secondary-sm" onclick="enableNewUser()" id="t-btn-new-user">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span id="t-btn-new-user-text">Registrar otro nombre</span>
        </button>
      </div>
    </div>

    <button id="startBtn" class="btn-primary" onclick="startGym()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span id="t-btn-start">Iniciar Sesión</span>
    </button>
    <button id="stopBtn" class="btn-primary btn-danger" onclick="stopGym()" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      <span id="t-btn-stop">Finalizar Entrenamiento</span>
    </button>
  </div>

  <div class="card">
    <div class="section-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
      <span id="t-title-ranking">Clasificación Mensual</span>
    </div>

    <div class="ranking-grid">
      <div class="ranking-block">
        <div class="ranking-header">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span id="t-rank-count">Más Visitas</span>
        </div>
        <ol id="countRanking"><div class="empty-msg" id="t-empty-1">Sin datos aún</div></ol>
      </div>

      <div class="ranking-block">
        <div class="ranking-header">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="t-rank-time">Más Tiempo (Minutos)</span>
        </div>
        <ol id="timeRanking"><div class="empty-msg" id="t-empty-2">Sin datos aún</div></ol>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwu8QoQvf3WUtAKAlvz8s2nbfNkcsGPEA",
      authDomain: "mygym-status.firebaseapp.com",
      databaseURL: "https://mygym-status-default-rtdb.firebaseio.com",
      projectId: "mygym-status",
      storageBucket: "mygym-status.firebasestorage.app",
      messagingSenderId: "541527735055",
      appId: "1:541527735055:web:9f14d9f742636abe261c7a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const i18n = {
      es: {
        subtitle: "Gimnasio Familiar",
        statusTitle: "Estado Actual",
        free: "Disponible (Vacío)",
        busy: "En uso por",
        labelUser: "¿Quién eres?",
        placeholder: "Escribe tu nombre...",
        btnNewUserText: "Registrar otro nombre",
        btnStart: "Iniciar Sesión",
        btnStop: "Finalizar Entrenamiento",
        rankingTitle: "Clasificación Mensual",
        rankCount: "Más Visitas",
        rankTime: "Más Tiempo (Minutos)",
        empty: "Sin datos este mes",
        alertSelect: "Por favor escribe o selecciona tu nombre",
        unitCount: "visitas",
        unitMin: "min"
      },
      ja: {
        subtitle: "ファミリージム",
        statusTitle: "現在の利用状況",
        free: "空いています（利用可能）",
        busy: "さんが利用中",
        labelUser: "あなたはだれ？",
        placeholder: "名前を入力してください...",
        btnNewUserText: "別の名前を入力する",
        btnStart: "利用開始",
        btnStop: "利用終了",
        rankingTitle: "今月のランキング",
        rankCount: "回数トップ",
        rankTime: "合計時間トップ",
        empty: "今月の記録はありません",
        alertSelect: "名前を入力または選択してください",
        unitCount: "回",
        unitMin: "分"
      }
    };

    let currentLang = localStorage.getItem("gym_lang") || "es";
    let currentStatus = null;
    let timerInterval = null;

    window.switchLang = (lang) => {
      currentLang = lang;
      localStorage.setItem("gym_lang", lang);
      document.getElementById("btn-es").className = lang === "es" ? "lang-btn active" : "lang-btn";
      document.getElementById("btn-ja").className = lang === "ja" ? "lang-btn active" : "lang-btn";
      updateI18n();
    };

    function updateI18n() {
      const t = i18n[currentLang];
      document.querySelector(".brand-title p").innerText = t.subtitle;
      document.getElementById("t-status-title").innerText = t.statusTitle;
      document.getElementById("t-label-user").innerText = t.labelUser;
      document.getElementById("userNameInput").placeholder = t.placeholder;
      document.getElementById("t-btn-new-user-text").innerText = t.btnNewUserText;
      document.getElementById("t-btn-start").innerText = t.btnStart;
      document.getElementById("t-btn-stop").innerText = t.btnStop;
      document.getElementById("t-title-ranking").innerText = t.rankingTitle;
      document.getElementById("t-rank-count").innerText = t.rankCount;
      document.getElementById("t-rank-time").innerText = t.rankTime;

      if (currentStatus) renderStatus(currentStatus);
    }

    function getSavedUsers() {
      const saved = localStorage.getItem("gym_saved_users");
      return saved ? JSON.parse(saved) : [];
    }

    function saveUser(name) {
      let users = getSavedUsers();
      if (!users.includes(name)) {
        users.push(name);
        localStorage.setItem("gym_saved_users", JSON.stringify(users));
      }
      localStorage.setItem("gym_last_user", name);
      setupUserUI();
    }

    function setupUserUI() {
      const users = getSavedUsers();
      const lastUser = localStorage.getItem("gym_last_user");

      const firstContainer = document.getElementById("first-time-container");
      const returningContainer = document.getElementById("returning-container");
      const select = document.getElementById("userNameSelect");

      if (users.length > 0) {
        firstContainer.style.display = "none";
        returningContainer.style.display = "block";
        select.innerHTML = users.map(u => `<option value="${u}" ${u === lastUser ? "selected" : ""}>${u}</option>`).join("");
      } else {
        firstContainer.style.display = "block";
        returningContainer.style.display = "none";
      }
    }

    window.enableNewUser = () => {
      document.getElementById("first-time-container").style.display = "block";
      document.getElementById("returning-container").style.display = "none";
      document.getElementById("userNameInput").value = "";
      document.getElementById("userNameInput").focus();
    };

    function renderStatus(data) {
      const t = i18n[currentLang];
      const statusEl = document.getElementById("status");
      const statusVal = document.getElementById("t-status-val");
      const timerEl = document.getElementById("status-timer");
      const timerText = document.getElementById("timer-text");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const userGroup = document.getElementById("user-input-group");

      if (timerInterval) clearInterval(timerInterval);

      if (data && data.isBusy) {
        statusEl.className = "status-badge busy";
        statusVal.innerText = currentLang === "es" ? `${t.busy} ${data.user}` : `${data.user} ${t.busy}`;
        userGroup.style.display = "none";
        startBtn.style.display = "none";
        stopBtn.style.display = "flex";

        timerEl.style.display = "flex";
        const updateTimer = () => {
          const elapsedSec = Math.floor((Date.now() - data.startTime) / 1000);
          const mins = Math.floor(elapsedSec / 60);
          const secs = elapsedSec % 60;
          timerText.innerText = `${mins}m ${secs < 10 ? '0' : ''}${secs}s`;
        };
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
      } else {
        statusEl.className = "status-badge free";
        statusVal.innerText = t.free;
        timerEl.style.display = "none";
        userGroup.style.display = "flex";
        startBtn.style.display = "flex";
        stopBtn.style.display = "none";
      }
    }

    onValue(ref(db, "current"), (snapshot) => {
      currentStatus = snapshot.val();
      renderStatus(currentStatus);
    });

    window.startGym = () => {
      const users = getSavedUsers();
      let name = "";

      if (users.length === 0 || document.getElementById("first-time-container").style.display !== "none") {
        name = document.getElementById("userNameInput").value.trim();
      } else {
        name = document.getElementById("userNameSelect").value;
      }

      if (!name) return alert(i18n[currentLang].alertSelect);

      saveUser(name);

      set(ref(db, "current"), {
        isBusy: true,
        user: name,
        startTime: Date.now()
      });
    };

    window.stopGym = () => {
      if (!currentStatus || !currentStatus.isBusy) return;
      const endTime = Date.now();
      const durationMin = Math.max(1, Math.round((endTime - currentStatus.startTime) / 1000 / 60));

      push(ref(db, "logs"), {
        user: currentStatus.user,
        startTime: currentStatus.startTime,
        endTime: endTime,
        duration: durationMin,
        month: new Date().toISOString().slice(0, 7)
      });

      set(ref(db, "current"), { isBusy: false });
    };

    onValue(ref(db, "logs"), (snapshot) => {
      const logs = snapshot.val();
      const t = i18n[currentLang];
      if (!logs) return;

      const currentMonth = new Date().toISOString().slice(0, 7);
      const counts = {};
      const times = {};

      Object.values(logs).forEach(log => {
        if (log.month === currentMonth) {
          counts[log.user] = (counts[log.user] || 0) + 1;
          times[log.user] = (times[log.user] || 0) + log.duration;
        }
      });

      renderRanking("countRanking", counts, t.unitCount);
      renderRanking("timeRanking", times, t.unitMin);
    });

    function renderRanking(elementId, dataMap, unit) {
      const sorted = Object.entries(dataMap).sort((a, b) => b[1] - a[1]);
      const listEl = document.getElementById(elementId);
      if (sorted.length === 0) {
        listEl.innerHTML = `<div class="empty-msg">${i18n[currentLang].empty}</div>`;
        return;
      }
      listEl.innerHTML = sorted.map(([user, val], idx) => `
        <li>
          <div class="rank-left">
            <span class="rank-num">${idx + 1}</span>
            <span class="rank-name">${user}</span>
          </div>
          <span class="rank-val">${val} ${unit}</span>
        </li>
      `).join("");
    }

    setupUserUI();
    switchLang(currentLang);
  </script>
</body>
</html>
